
<!DOCTYPE html>
<html>
<head>
    <title>SVG Text Art</title>
</head>
<body style="text-align:center; background:#e9eef3;">

<h1>SVG Text Art: Keep Going</h1>

<svg width="900" height="780" viewBox="0 0 900 780">

    <!-- Background -->
    <path d="M0 0 H900 V780 H0 Z" fill="#142b4d"/>

    <!-- Stars -->
    <path d="M130 100 L140 120 L160 130 L140 140 L130 160 L120 140 L100 130 L120 120 Z"
          fill="white"/>

    <path d="M750 100 L760 120 L780 130 L760 140 L750 160 L740 140 L720 130 L740 120 Z"
          fill="white"/>

    <!-- Sun -->
    <circle cx="450" cy="300" r="110" fill="#ffd580"/>

    <!-- Mountains -->
    <path d="M0 420 L130 280 L215 365 L345 225
             L470 380 L590 260 L735 390
             L830 300 L900 390 L900 780 L0 780 Z"
          fill="#344f70"/>

    <!-- Foreground mountains -->
    <path d="M0 470 L160 350 L260 430 L390 310
             L530 460 L670 335 L800 450
             L900 370 L900 780 L0 780 Z"
          fill="#263f5d"/>

    <!-- Ground -->
    <path d="M0 545 Q170 470 310 540
             Q480 610 650 520 Q790 465 900 550
             L900 780 L0 780 Z"
          fill="#18364c"/>

    <!-- Winding road -->
    <path d="M390 780 C380 700 520 680 490 610
             C455 550 350 555 390 490
             C430 430 470 430 450 385"
          fill="none" stroke="#71869a"
          stroke-width="150" stroke-linecap="round"/>

    <!-- Road center -->
    <path d="M390 780 C380 700 520 680 490 610
             C455 550 350 555 390 490
             C430 430 470 430 450 385"
          fill="none" stroke="#ffe6a3"
          stroke-width="7" stroke-dasharray="22 25"/>

    <!-- Main text -->
    <text x="450" y="100"
          text-anchor="middle"
          font-size="25"
          fill="white"
          letter-spacing="5">
        A REMINDER TO KEEP MOVING
    </text>

    <text x="450" y="160"
          text-anchor="middle"
          font-size="60"
          font-weight="bold"
          fill="#fff4d6">
        KEEP GOING
    </text>

    <!-- Decorative line -->
    <path d="M260 180 Q450 210 640 180"
          fill="none"
          stroke="#f4c978"
          stroke-width="3"/>

    <!-- Quotation -->
    <text x="450" y="230"
          text-anchor="middle"
          font-size="28"
          font-style="italic"
          fill="#fce6b5">
        Your path will find its way.
    </text>

    <!-- Footer -->
    <text x="450" y="735"
          text-anchor="middle"
          font-size="20"
          letter-spacing="5"
          fill="white">
        ONE STEP AT A TIME
    </text>

</svg>

</body>
</html>
